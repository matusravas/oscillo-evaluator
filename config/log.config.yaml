version: 1
formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  info_file_handler:
    class: logging.handlers.TimedRotatingFileHandler
    when: midnight
    interval: 1
    level: INFO
    formatter: simple
    filename: logs/info.log
    encoding: utf-8
  error_file_handler:
    class: logging.handlers.TimedRotatingFileHandler
    when: midnight
    interval: 1
    level: ERROR
    formatter: simple
    filename: logs/error.log
    encoding: utf-8
loggers:
  sampleLogger:
    level: DEBUG
    handlers: [console, info_file_handler, error_file_handler]
    propagate: no
root:
  level: DEBUG
  handlers: [console, info_file_handler, error_file_handler]